[project]
name = "pydantic-ai-textbook-labs"
version = "0.1.0"
description = "《Pydantic AI 智能体工程实战》配套 labs 与验收测试"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

# 注意：由于本目录位于 pydantic-ai 仓库内，运行请使用
#   uv run --no-project --with "pydantic-ai-slim,pytest" python -m pytest -q
# 以避免与仓库根 workspace 的依赖解析发生冲突。
